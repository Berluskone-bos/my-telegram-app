name: Tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: t
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d t"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://user:pass@localhost:5432/t
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Проверить синтаксис серверного кода
        run: for f in bot/*.js; do node --check "$f"; done
      - name: Автотесты (подпись Telegram, секреты, вход в админку, склад)
        run: npm test
