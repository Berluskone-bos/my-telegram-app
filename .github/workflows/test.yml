name: Tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: t
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d t"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://user:pass@localhost:5432/t
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Проверить синтаксис всего серверного кода
        run: find bot -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Проверить зависимости на уязвимости высокой и критической серьёзности
        run: npm audit --omit=dev --audit-level=high
      - name: Получить базовую ветку для проверки истории Git
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${GITHUB_BASE_REF}"
      - name: Поиск секретов в изменениях и истории Git
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Автотесты (подпись Telegram, секреты, вход в админку, склад)
        run: npm test
